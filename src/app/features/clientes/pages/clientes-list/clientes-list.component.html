<div class="clientes-container">

  <h2 class="title">Clientes</h2>

  <div class="top-bar">
    <input
      type="text"
      placeholder="Buscar"
      class="search-input"
      [formControl]="searchControl"
    />

    <button class="btn-nuevo" (click)="goToNew()">
      Nuevo
    </button>
  </div>

  <div class="table-container">

    <div *ngIf="loading" class="loading-container">
      <div class="spinner"></div>
      <p>Cargando clientes...</p>
    </div>

    <table *ngIf="!loading && filteredClientes.length > 0">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Identificación</th>
          <th>Cliente ID</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let cliente of filteredClientes">
          <td>{{ cliente.nombre }}</td>
          <td>{{ cliente.identificacion }}</td>
          <td>{{ cliente.clienteId }}</td>
          <td>{{ cliente.estado ? 'Activo' : 'Inactivo' }}</td>
          <td>
            <button class="btn-edit"
                    (click)="editCliente(cliente.id)">
              Editar
            </button>

            <button class="btn-delete"
                    (click)="deleteCliente(cliente.id)">
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!loading && filteredClientes.length === 0"
         class="no-data">
      No hay datos disponibles
    </div>

  </div>

</div>
